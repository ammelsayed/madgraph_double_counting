name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: get MG5aMC 3.8.1
        run: |
          wget -q https://launchpad.net/mg5amcnlo/3.0/3.8.x/+download/MG5_aMC_v3.8.1.tar.gz
          tar -xzf MG5_aMC_v3.8.1.tar.gz

      - name: install plugin
        run: bash ./install.sh --mg5 "$PWD/MG5_aMC_v3_8_1" --from-local

      - name: run tests
        run: |
          PYTHONPATH="$PWD:$PWD/MG5_aMC_v3_8_1" \
            python -m unittest discover -s tests -p 'test_*.py' -v
