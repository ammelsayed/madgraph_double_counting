name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mg5: ["3.6.7", "3.7.3", "3.8.1"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install python and ghostscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          python -m pip install six

      - name: get MG5aMC ${{ matrix.mg5 }}
        env:
          MG5_VERSION: ${{ matrix.mg5 }}
        run: |
          case "$MG5_VERSION" in
            3.6.*) branch=3.6.x ;;
            3.7.*) branch=3.7.x ;;
            3.8.*) branch=3.8.x ;;
            *) echo "Unknown MG5 version: $MG5_VERSION" >&2; exit 1 ;;
          esac
          url="https://launchpad.net/mg5amcnlo/3.0/$branch/+download/MG5_aMC_v$MG5_VERSION.tar.gz"
          wget -q "$url"
          tar -xzf "MG5_aMC_v$MG5_VERSION.tar.gz"
          echo "MG5DIR=$PWD/MG5_aMC_v${MG5_VERSION//./_}" >> "$GITHUB_ENV"

      - name: install plugin
        run: bash ./install.sh --mg5 "$MG5DIR" --from-local

      - name: run tests
        run: |
          PYTHONPATH="$PWD:$MG5DIR" \
            python -m unittest discover -s tests -p 'test_*.py' -v
